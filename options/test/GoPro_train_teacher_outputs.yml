name: generate_HI_Diff_GoPro_Train_Teacher
model_type: HI_Diff_S2
scale: 1
num_gpu: 1
manual_seed: 100
datasets:
  test_1:
    name: GoPro_Train_Teacher
    type: PairedImageIRDataset
    dataroot_gt: /home/m11302124/MIMO-UNet-Wavelet/dataset/GOPRO/train/sharp
    dataroot_lq: /home/m11302124/MIMO-UNet-Wavelet/dataset/GOPRO/train/blur
    filename_tmpl: '{}'
    io_backend:
      type: disk
network_g:
  type: Transformer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks:
  - 3
  - 5
  - 6
  - 6
  num_refinement_blocks: 4
  heads:
  - 1
  - 2
  - 4
  - 8
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false
  embed_dim: 64
  group: 4
network_le:
  type: latent_encoder_gelu
  in_chans: 6
  embed_dim: 64
  block_num: 6
  group: 4
  stage: 1
  patch_expansion: 0.5
  channel_expansion: 4
network_le_dm:
  type: latent_encoder_gelu
  in_chans: 3
  embed_dim: 64
  block_num: 6
  group: 4
  stage: 2
  patch_expansion: 0.5
  channel_expansion: 4
network_d:
  type: denoising
  in_channel: 256
  out_channel: 256
  inner_channel: 512
  block_num: 4
  group: 4
  patch_expansion: 0.5
  channel_expansion: 2
diffusion_schedule:
  apply_ldm: false
  schedule: linear
  timesteps: 8
  linear_start: 0.1
  linear_end: 0.99
path:
  pretrain_network_g: experiments/pretrained_models/HI_Diff_GoPro/net_g.pth
  param_key_g: params
  strict_load_g: true
  pretrain_network_le_dm: experiments/pretrained_models/HI_Diff_GoPro/net_le_dm.pth
  strict_load_le_dm: true
  pretrain_network_d: experiments/pretrained_models/HI_Diff_GoPro/net_d.pth
  strict_load_d: true
  resume_state: null
val:
  save_img: true
  suffix: null
  selfensemble_testing: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
